<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sahil Quiz Challenge</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#101010;color:white;font-family:Arial,sans-serif}
header{background:#e50914;padding:16px;display:flex;justify-content:space-between;align-items:center}
h1{font-size:23px;margin:0}
main{max-width:520px;margin:auto;padding:18px}
.card{background:#202020;padding:18px;border-radius:14px;margin:14px 0}
button,select{border:0;border-radius:9px;padding:13px;font-size:15px;cursor:pointer}
button{background:#e50914;color:white;font-weight:bold}
select{width:100%;background:#303030;color:white;margin:12px 0}
.primary{width:100%;margin-top:10px}
.option{display:block;width:100%;text-align:left;margin:10px 0;background:#333;color:white}
.option:disabled{opacity:1}
.correct{background:#168344!important}
.wrong{background:#b52323!important}
.small{color:#bbb;font-size:14px}
#quiz,#result{display:none}
.bar{height:7px;background:#444;border-radius:10px;overflow:hidden}
#progress{height:100%;width:0;background:#e50914}
.stat{display:flex;justify-content:space-between;gap:8px}
.stat div{background:#303030;padding:12px;border-radius:9px;flex:1;text-align:center}
</style>
</head>
<body>
<header><h1>🔥 SAHIL QUIZ</h1><span>Daily Challenge</span></header>
<main>
<section id="home">
<div class="card">
<h2>Welcome to Sahil Quiz!</h2>
<p>Test your knowledge every day.</p>
<div class="stat">
<div><b>100</b><br><span class="small">Questions</span></div>
<div><b>5</b><br><span class="small">Categories</span></div>
</div>
<h3>Choose Category</h3>
<select id="category">
<option value="All">All Categories</option>
<option>General Knowledge</option>
<option>Science</option>
<option>Sports</option>
<option>Technology</option>
<option>India</option>
</select>
<p class="small">Each session has up to 100 questions. Correct answers earn 1 point.</p>
<button class="primary" onclick="startQuiz()">START QUIZ</button>
</div>
</section>

<section id="quiz">
<div class="card">
<div class="stat">
<div>Score: <b id="score">0</b></div>
<div>Question: <b id="number">1</b></div>
<div>Time: <b id="timer">15</b>s</div>
</div>
<br><div class="bar"><div id="progress"></div></div>
<p class="small" id="categoryName"></p>
<h2 id="question"></h2>
<div id="options"></div>
<p id="feedback"></p>
<button class="primary" id="next" onclick="nextQuestion()" disabled>Next Question →</button>
</div>
</section>

<section id="result">
<div class="card">
<h2>🎉 Quiz Completed!</h2>
<h1 id="finalScore"></h1>
<p id="message"></p>
<p id="best"></p>
<button class="primary" onclick="showHome()">Play Again</button>
</div>
</section>
</main>

<script>

let questions=[],index=0,score=0,timer=15,clock=null,answered=false;
function startQuiz(){
const cat=document.getElementById("category").value;
questions=data.filter(q=>cat==="All"||q[0]===cat);
questions.sort(()=>Math.random()-0.5);
index=0;score=0;
document.getElementById("home").style.display="none";
document.getElementById("result").style.display="none";
document.getElementById("quiz").style.display="block";
showQuestion();
}
function showQuestion(){
clearInterval(clock);answered=false;timer=15;
const q=questions[index];
document.getElementById("score").textContent=score;
document.getElementById("number").textContent=(index+1)+"/"+questions.length;
document.getElementById("timer").textContent=timer;
document.getElementById("progress").style.width=(index/questions.length*100)+"%";
document.getElementById("categoryName").textContent=q[0];
document.getElementById("question").textContent=q[1];
document.getElementById("feedback").textContent="";
document.getElementById("next").disabled=true;
document.getElementById("next").textContent=index===questions.length-1?"See Results":"Next Question →";
const box=document.getElementById("options");box.innerHTML="";
q[2].forEach((option,i)=>{
const b=document.createElement("button");
b.className="option";b.textContent=String.fromCharCode(65+i)+". "+option;
b.onclick=()=>choose(i);box.appendChild(b);
});
clock=setInterval(()=>{
timer--;document.getElementById("timer").textContent=timer;
if(timer<=0){clearInterval(clock);choose(-1)}
},1000);
}
function choose(choice){
if(answered)return;
answered=true;clearInterval(clock);
const q=questions[index],buttons=document.querySelectorAll(".option");
buttons.forEach((b,i)=>{
b.disabled=true;
if(i===q[3])b.classList.add("correct");
if(i===choice&&choice!==q[3])b.classList.add("wrong");
});
if(choice===q[3]){
score++;document.getElementById("feedback").textContent="✅ Correct! +1 point";
}else{
document.getElementById("feedback").textContent="❌ "+(choice===-1?"Time is up! ":"Incorrect. ")+"Correct answer: "+q[2][q[3]];
}
document.getElementById("score").textContent=score;
document.getElementById("next").disabled=false;
}
function nextQuestion(){
if(!answered)return;
index++;
if(index>=questions.length){finishQuiz();return}
showQuestion();
}
function finishQuiz(){
clearInterval(clock);
document.getElementById("quiz").style.display="none";
document.getElementById("result").style.display="block";
const pct=Math.round(score/questions.length*100);
document.getElementById("finalScore").textContent=score+" / "+questions.length;
document.getElementById("message").textContent="Accuracy: "+pct+"% — "+(pct>=80?"Excellent work! 🏆":pct>=50?"Good effort! Keep practising! 💪":"Keep learning and try again! 📚");
let best=Number(localStorage.getItem("sahilBestScore")||0);
if(score>best){best=score;localStorage.setItem("sahilBestScore",best)}
document.getElementById("best").textContent="Your best score: "+best;
}
function showHome(){
document.getElementById("result").style.display="none";
document.getElementById("home").style.display="block";
}
</script>
</body>
</html>
