<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sahil App</title>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      padding: 24px 16px;
      background: #090909;
      color: #ffffff;
      font-family: Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .card {
      width: 100%;
      max-width: 390px;
      background: #171717;
      border: 1px solid #343434;
      border-radius: 20px;
      padding: 28px 22px;
      box-shadow: 0 12px 40px #00000080;
    }

    h1 { margin-top: 0; }

    .brand {
      color: #ff3030;
      text-align: center;
      font-size: 30px;
    }

    .subtitle {
      color: #aaaaaa;
      text-align: center;
      margin-bottom: 28px;
    }

    h2 { margin-top: 0; }

    input {
      width: 100%;
      padding: 14px;
      margin: 8px 0;
      border-radius: 10px;
      border: 1px solid #444444;
      background: #242424;
      color: white;
      font-size: 16px;
    }

    button {
      width: 100%;
      padding: 14px;
      margin-top: 12px;
      border: none;
      border-radius: 10px;
      background: #e51b23;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.6;
      cursor: wait;
    }

    .secondary {
      background: #292929;
      border: 1px solid #555555;
    }

    .profile-box {
      padding: 14px;
      margin: 12px 0;
      border-radius: 10px;
      background: #242424;
      overflow-wrap: anywhere;
    }

    .label { color: #aaaaaa; }
    #message {
      color: #ff7777;
      font-size: 14px;
      overflow-wrap: anywhere;
    }

    .hidden { display: none !important; }
  </style>
</head>

<body>
  <main class="card">
    <section id="login">
      <h1 class="brand">SAHIL APP</h1>
      <p class="subtitle">Your account. Your profile.</p>

      <h2>Welcome</h2>
      <input id="username" type="email"
        placeholder="Email address" autocomplete="email">

      <input id="password" type="password"
        placeholder="Password (minimum 6 characters)"
        autocomplete="current-password">

      <button id="loginBtn" onclick="login()">Login</button>
      <button id="signupBtn" class="secondary"
        onclick="signup()">Create Account</button>

      <p id="message" role="status"></p>
    </section>

    <section id="home" class="hidden">
      <h1 class="brand">SAHIL APP</h1>
      <p class="subtitle">You're logged in!</p>

      <h2>My Profile</h2>

      <div class="profile-box">
        <p id="profileName">Name: Sahil</p>
        <input id="editName" type="text"  placeholder="Enter your name">
        <button onclick="saveProfile()">Save     Profile</button>
        <p id="profileMessage"></p>

        <p id="profileEmail"></p>
        <p class="label">App: Sahil App</p>
      </div>

      <button onclick="logout()">Logout</button>
      <p id="homeMessage" role="status"></p>
    </section>
  </main>

  <script type="module">
    import { initializeApp }
      from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

    import {
      getAuth,
      createUserWithEmailAndPassword,
      signInWithEmailAndPassword,
      signOut
    } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

    import {
      getFirestore,
      doc,
      setDoc,
      getDoc
    } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyB_EQa914negHJUDyHwIU7QzI26nnv445U",
      authDomain: "sahilapp-22410.firebaseapp.com",
      projectId: "sahilapp-22410",
      storageBucket: "sahilapp-22410.firebasestorage.app",
      messagingSenderId: "1062905599098",
      appId: "1:1062905599098:web:a114d33d78c40f3293d7c3",
      measurementId: "G-1Q1379E1DH"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    const $ = id => document.getElementById(id);

    function showMessage(message) {
      $("message").textContent = message;
    }

    function explainError(error) {
      const messages = {
        "auth/invalid-email": "Email address sahi nahi hai.",
        "auth/missing-password": "Password daalo.",
        "auth/weak-password": "Password kam se kam 6 characters ka rakho.",
        "auth/email-already-in-use": "Is email ka account pehle se hai. Login karo.",
        "auth/invalid-credential": "Email ya password galat hai.",
        "auth/network-request-failed": "Internet check karke dobara try karo.",
        "auth/operation-not-allowed": "Firebase mein Email/Password sign-in enable karo."
      };

      return messages[error.code] ||
        "Error: " + error.code + " — " + error.message;
    }

    function setBusy(busy) {
      $("loginBtn").disabled = busy;
      $("signupBtn").disabled = busy;
    }

    async function showProfile(user) {
      $("homeMessage").textContent = "Profile load ho rahi hai...";

      try {
        const profileRef = doc(db, "users", user.uid);
        const profileSnap = await getDoc(profileRef);
        const profile = profileSnap.exists() ? profileSnap.data() : {};

        $("profileName").textContent = "Name: " + (profile.name || "Sahil");
        $("profileEmail").textContent = "Email: " + (user.email || "");

        $("login").classList.add("hidden");
        $("home").classList.remove("hidden");
        $("homeMessage").textContent = "";
      } catch (error) {
        $("homeMessage").textContent = explainError(error);
      }
    }

window.saveProfile = async function () {
  const user = auth.currentUser;
  const name = document.getElementById("editName").value.trim();
  const message = document.getElementById("profileMessage");

  if (!user) {
    message.textContent = "Pehle login karo.";
    return;
  }

  if (!name) {
    message.textContent = "Apna naam likho.";
    return;
  }

  message.textContent = "Saving...";

  try {
    await setDoc(
      doc(db, "users", user.uid),
      { name: name, email: user.email },
      { merge: true }
    );

    document.getElementById("profileName").textContent = "Name: " + name;
    message.textContent = "Profile online save ho gayi!";
  } catch (error) {
    message.textContent = "Save nahi hua: " + error.message;
  }
};

    window.login = async function () {
      const email = $("username").value.trim();
      const password = $("password").value;

      if (!email || !password) {
        showMessage("Email aur password dono daalo.");
        return;
      }

      setBusy(true);
      showMessage("Login ho raha hai...");

      try {
        const result = await signInWithEmailAndPassword(auth, email, password);
        await showProfile(result.user);
      } catch (error) {
        showMessage(explainError(error));
      } finally {
        setBusy(false);
      }
    };

    window.signup = async function () {
      const email = $("username").value.trim();
      const password = $("password").value;

      if (!email || !password) {
        showMessage("Email aur password dono daalo.");
        return;
      }

      if (password.length < 6) {
        showMessage("Password kam se kam 6 characters ka rakho.");
        return;
      }

      setBusy(true);
      showMessage("Account ban raha hai...");

      try {
        const result = await createUserWithEmailAndPassword(
          auth, email, password
        );

        await setDoc(doc(db, "users", result.user.uid), {
          name: "Sahil",
          email: result.user.email
        });

        await showProfile(result.user);
      } catch (error) {
        showMessage(explainError(error));
      } finally {
        setBusy(false);
      }
    };

    window.logout = async function () {
      try {
        await signOut(auth);
        $("home").classList.add("hidden");
        $("login").classList.remove("hidden");
        $("password").value = "";
        showMessage("Logout ho gaya.");
      } catch (error) {
        $("homeMessage").textContent = explainError(error);
      }
    };
  </script>
</body>
</html>
