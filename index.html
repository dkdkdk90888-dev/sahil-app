<!DOCTYPE html>
<html>
<body>
  <h1>Hello Sahil!</h1>

  <div id="login">
    <h2>Login</h2>
   <input id="username" type="email" placeholder="Email address">
<br><br>
<input id="password" type="password" placeholder="Password (minimum 6 characters)">
<br><br>
<button onclick="login()">Login</button>
<button onclick="signup()">Create Account</button>

  </div>

  <div id="home" style="display:none">
    <h1>Welcome, Sahil!</h1>
    
<h2>My Profile</h2>
<p id="profileName">Name: Sahil</p>
<p id="profileEmail">Email:</p>
<p>App: Sahil App</p>
<button onclick="logout()">Logout</button>
    <button onclick="logout()">Logout</button>
  </div>

  
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {
  getAuth,
  createUserWithEmailAndPassword,
  signInWithEmailAndPassword,
  signOut
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import {
  getFirestore,
  doc,
  setDoc,
  getDoc
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

// Yahan apna poora firebaseConfig object paste karna hai
const firebaseConfig = PASTE_YOUR_CONFIG_HERE;
// For Firebase JS SDK v7.20.0 and later, measurementId is optional
const firebaseConfig = {
  apiKey: "AIzaSyB_EQa914negHJUDyHwIU7QzI26nnv445U",
  authDomain: "sahilapp-22410.firebaseapp.com",
  projectId: "sahilapp-22410",
  storageBucket: "sahilapp-22410.firebasestorage.app",
  messagingSenderId: "1062905599098",
  appId: "1:1062905599098:web:a114d33d78c40f3293d7c3",
  measurementId: "G-1Q1379E1DH"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

window.login = async function () {
  const email = document.getElementById("username").value.trim();
  const password = document.getElementById("password").value;

  try {
    const result = await signInWithEmailAndPassword(auth, email, password);
    await showProfile(result.user);
  } catch (error) {
    alert("Login nahi hua: " + error.message);
  }
};

window.signup = async function () {
  const email = document.getElementById("username").value.trim();
  const password = document.getElementById("password").value;

  try {
    const result = await createUserWithEmailAndPassword(auth, email, password);
    await setDoc(doc(db, "users", result.user.uid), {
      email: result.user.email,
      name: "Sahil"
    });
    await showProfile(result.user);
  } catch (error) {
    alert("Account nahi bana: " + error.message);
  }
};

async function showProfile(user) {
  const profileRef = doc(db, "users", user.uid);
  const profileSnap = await getDoc(profileRef);
  const profile = profileSnap.exists() ? profileSnap.data() : {};

  document.getElementById("home").style.display = "block";
  document.getElementById("login").style.display = "none";

  const nameLine = document.getElementById("profileName");
  if (nameLine) nameLine.textContent = "Name: " + (profile.name || "Sahil");
  const emailLine = document.getElementById("profileEmail");
  if (emailLine) emailLine.textContent = "Email: " + user.email;
}

window.logout = async function () {
  await signOut(auth);
  document.getElementById("home").style.display = "none";
  document.getElementById("login").style.display = "block";
};
</script>

</body>

<style>
  body {
    background: #101827;
    color: white;
    font-family: Arial, sans-serif;
    text-align: center;
    padding: 20px;
  }

  input {
    padding: 12px;
    border-radius: 8px;
    border: 1px solid #64748b;
    margin: 5px;
    width: 80%;
    max-width: 280px;
  }

  button {
    background: #7c3aed;
    color: white;
    padding: 12px 24px;
    border: none;
    border-radius: 8px;
    margin: 8px;
    font-size: 16px;
  }

  button:active {
    background: #5b21b6;
  }
</style>

</html>
